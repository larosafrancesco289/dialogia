name: Release

# `release` is a fast-forward pointer to what is live on dialogia.dev. Every
# push to it runs the same checks as CI, builds, and deploys the Worker.
# Ship with `git push origin main:release` (see CONTRIBUTING.md).

on:
  push:
    branches: [release]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      - run: ./scripts/ci.sh

      - run: bun run build

      # Pinned: the action's own default (3.90) uploads dist/_headers as a plain
      # file instead of applying it, so frame-ancestors, nosniff and the
      # Permissions-Policy never reached visitors.
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: '4.144.0'
          command: deploy
