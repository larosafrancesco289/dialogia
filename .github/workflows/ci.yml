name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      # Type check, full test suite, Prettier, ESLint layer boundaries, and the
      # knip dead-code check — the same script contributors run locally.
      - run: ./scripts/ci.sh

      - run: bun run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      - run: bunx playwright install --with-deps chromium

      # The critical journeys in a real browser, against the mock model in
      # e2e/mock: first run, streaming, Stop, cut-off, retry, tabs, import.
      - run: bun run e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
