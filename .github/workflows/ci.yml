name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      # Type check, full test suite, Prettier, ESLint layer boundaries, and the
      # knip dead-code check — the same script contributors run locally.
      - run: ./scripts/ci.sh

      - run: bun run build
